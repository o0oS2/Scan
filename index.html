<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét Lot ID</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quét Lot ID">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--pr:#2563eb;--ok:#16a34a;--dg:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2c333d;--pr:#3b82f6;--ok:#22c55e;--dg:#ef4444}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2c333d;--pr:#3b82f6;--ok:#22c55e;--dg:#ef4444}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
h1{font-size:20px;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{min-width:0;padding:11px 8px;font-size:15px;background:var(--card);color:var(--mu);border:1px solid var(--bd)}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:rgba(128,128,128,.25);font-size:12px;line-height:20px}
.tabs button.on .badge{background:rgba(255,255,255,.3)}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:1/1;display:none;margin-top:10px}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
.frame.hit{border-color:var(--ok)}
@media(min-width:700px){.cam{aspect-ratio:16/10}.frame{inset:12% 30%}}
.status{margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--mu);font-size:14px;min-height:44px}
.status.ok{color:var(--ok);border-color:var(--ok)}
.status.warn{color:var(--dg);border-color:var(--dg)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
button{flex:1;min-width:130px;padding:14px 16px;border:0;border-radius:12px;font:600 16px inherit;font-family:inherit;background:var(--pr);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.dg{background:var(--dg)}
button.ok{background:var(--ok)}
button.sm{min-width:0;padding:10px 14px;font-size:14px}
button.top-btn{flex:none}
button:disabled{opacity:.45}
[hidden]{display:none!important}
.list{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.lh{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:600}
.item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);align-items:flex-start}
.item:last-child{border-bottom:0}
.item.click{cursor:pointer;transition:background .25s}.item.click:active{background:var(--bg)}.item.copied{background:rgba(22,163,74,.2)}.item.copied .v::after{content:" ✓ đã chép";color:var(--ok);font-size:12px;font-weight:600}
.n{color:var(--mu);min-width:28px;font-variant-numeric:tabular-nums}
.v{flex:1;word-break:break-all}
.t{color:var(--mu);font-size:12px;white-space:nowrap}
.x{background:none;border:0;color:var(--mu);min-width:0;flex:0;padding:0 8px;font-size:22px;line-height:1}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px 0 8px}
.empty{padding:22px;text-align:center;color:var(--mu)}
/* bảng đã lưu */
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"n f c" ". d c" ". nt nt";column-gap:10px;row-gap:2px;padding:12px 14px;border-bottom:1px solid var(--bd);align-items:center}
.srow:last-child{border-bottom:0}
.srow.it{cursor:pointer}.srow.it:active{background:var(--bg)}
.srow .n{grid-area:n;min-width:0;text-align:right}
.srow .f{grid-area:f;font-weight:600;word-break:break-all}
.srow .d{grid-area:d;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .c{grid-area:c;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mu);white-space:nowrap}
.srow .nt{grid-area:nt;color:var(--mu);font-size:14px;word-break:break-word}
@media(min-width:700px){
  .srow{grid-template-columns:40px minmax(0,1.2fr) 150px 70px minmax(0,1.5fr);grid-template-areas:"n f d c nt";column-gap:14px}
  .srow .nt{font-size:15px}
}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(min-width:700px){.acts{grid-template-columns:repeat(4,1fr)}}
.acts button{min-width:0;padding:12px 6px;font-size:15px;white-space:nowrap}
.dgt{color:var(--dg)}
.meta{font-size:13px;color:var(--mu);margin:8px 0}
.dtitle{font-weight:700;word-break:break-all;margin:6px 0}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%) translateY(-80px);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;transition:transform .2s;max-width:90vw;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
/* thanh nút cố định ở đáy */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.bar-in{max-width:760px;margin:0 auto}
.bar .row{margin:0 0 8px}
.bar .row:last-child{margin-bottom:0}
.bar button.big{padding:16px;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📷 Quét Lot ID</h1>
    <button class="sec sm top-btn" id="bLink">🔗 Chia sẻ link</button>
  </div>
  <div class="tabs">
    <button id="t1" class="on">📷 Quét</button>
    <button id="t2">📁 Đã lưu <span class="badge" id="tcnt">0</span></button>
  </div>
  <div class="row" id="ctlInstall" hidden><button class="ok" id="bInstall">⬇ Cài app Quét Lot ID lên màn hình</button></div>

  <!-- TAB 1 -->
  <section id="p1">
    <input type="text" id="note" placeholder="📝 Ghi chú (vd: nhập kho lô A, kiểm kê…)" maxlength="200" autocomplete="off">
    <div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="frame" id="frame"></div></div>
    <div class="status" id="status">Bấm “Quét” để mở camera.</div>
    <div class="list">
      <div class="lh"><span>Mã đang quét</span><span id="cnt">0</span></div>
      <div id="items"><div class="empty">Chưa có mã nào.</div></div>
    </div>
  </section>

  <!-- TAB 2 -->
  <section id="p2" hidden>
    <div id="listView">
      <div class="list">
        <div id="srows"></div>
      </div>
    </div>
    <div id="detView" hidden>
      <input type="text" id="dNote" placeholder="Ghi chú" maxlength="200" autocomplete="off">
      <div class="acts">
        <button class="sec" id="dCopy">📋 Sao chép tất cả</button>
        <button class="ok" id="dXlsx">📊 Excel</button>
        <button id="dScan">▶ Quét tiếp</button>
        <button class="sec dgt" id="dDel">🗑 Xóa</button>
      </div>
      <div class="list">
        <div class="lh"><span id="dName" style="word-break:break-all"></span><span id="dCnt">0</span></div>
        <div id="dIds"></div>
      </div>
    </div>
  </section>
  <footer>© Đức Trung · v14</footer>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="row" id="ctl"><button class="big" id="bStart">▶ Quét</button></div>
    <div class="row" id="ctlScan" hidden><button class="dg big" id="bStop">⏹ Dừng</button></div>
    <div id="ctlStopped" hidden>
      <div class="row">
        <button class="big" id="bResume">▶ Tiếp tục</button>
        <button class="ok big" id="bNew">➕ Quét mới</button>
      </div>
      <div class="row">
        <button class="sec sm" id="bXlsx">📊 Excel</button>
        <button class="sec sm" id="bShare">📤 Chia sẻ</button>
        <button class="sec sm" id="bCopy">📋 Sao chép</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<canvas id="cv" hidden></canvas>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var vid=$('vid'),cam=$('cam'),frame=$('frame'),cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
  var stream=null,running=false,timer=null,lastCode='',lastAt=0,audioCtx=null;
  var LS={
    get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  var sessions=LS.get('qlid_sessions',[]);   // [{file,note,created,updated,codes:[{code,time}],sha,synced,err}]
  // Cấu hình repo/token nằm trên server (Vercel env). Máy chỉ giữ "mã truy cập" (nếu server yêu cầu).
  try{localStorage.removeItem('qlid_gh');localStorage.removeItem('qlid_key')}catch(e){}   // xoá token cũ lưu trên máy (nếu có)
  var cfg={repo:'',branch:'main',dir:'scans'};
  var srv={ready:false};
  var NAME_A=4,NAME_B=6;    // tên danh sách = NAME_A ký tự đầu - NAME_B ký tự tiếp theo của Lot ID đầu tiên
  var cur=null,seen={},detail=null,tab=1;

  function pad(n){return n<10?'0'+n:n}
  function now(){var d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
  function fmt(ts){var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
  function persist(){LS.set('qlid_sessions',sessions)}
  function setStatus(t,c){var s=$('status');s.textContent=t;s.className='status'+(c?' '+c:'')}
  function toast(m,ms){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},ms||1800)}
  function show(id,on){$(id).hidden=!on}
  function fitBar(){document.body.style.paddingBottom=(tab===1?$('bar').offsetHeight+16:24)+'px'}
  function codes(){return cur?cur.codes:[]}

  function ui(mode){
    show('ctl',mode==='idle');show('ctlScan',mode==='scan');show('ctlStopped',mode==='stopped');
    cam.classList.toggle('on',mode==='scan');
    var has=codes().length>0;
    ['bXlsx','bShare','bCopy'].forEach(function(i){$(i).disabled=!has});
    fitBar();
  }

  /* ---------- Tab ---------- */
  function showTab(n){
    if(n===2&&running)stop();
    tab=n;
    $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);
    show('p1',n===1);show('p2',n===2);show('bar',n===1);
    if(n===2){renderSessions();renderDetail();refresh()}
    fitBar();window.scrollTo(0,0);
  }

  /* ---------- Quét ---------- */
  function newSession(clearNote){
    cur={file:'',note:'',created:Date.now(),updated:0,codes:[],sha:'',synced:false,err:''};
    seen={};
    if(clearNote)$('note').value='';
    cur.note=$('note').value.trim();
  }
  function feedback(){
    try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=880;g.gain.value=.15;
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12);
    }catch(e){}
    frame.classList.add('hit');setTimeout(function(){frame.classList.remove('hit')},250);
  }
  function render(){
    var rows=codes();
    $('cnt').textContent=rows.length;
    var box=$('items');box.innerHTML='';
    if(!rows.length){box.innerHTML='<div class="empty">Chưa có mã nào.</div>';return}
    for(var i=rows.length-1;i>=0;i--){(function(i){
      var r=rows[i],d=document.createElement('div');d.className='item';
      var n=document.createElement('span');n.className='n';n.textContent=i+1;
      var v=document.createElement('span');v.className='v';v.textContent=r.code;
      var t=document.createElement('span');t.className='t';t.textContent=r.time.slice(11);
      var x=document.createElement('button');x.className='x';x.textContent='×';x.title='Xoá';
      x.onclick=function(){
        delete seen[r.code];cur.codes.splice(i,1);render();
        if(cur.file)commit(cur);
        if(!running)ui(cur.codes.length?'stopped':'idle');
      };
      d.append(n,v,t,x);box.appendChild(d);
    })(i)}
  }
  var saveT=null,saveS=null;
  function flushSave(){clearTimeout(saveT);var s=saveS;saveS=null;if(s&&s.file&&sessions.indexOf(s)>=0)commit(s)}
  function scheduleSave(s){if(saveS&&saveS!==s)flushSave();saveS=s;clearTimeout(saveT);saveT=setTimeout(flushSave,1000)}
  function onCode(code){
    var t=Date.now();
    if(seen[code]){
      if(code!==lastCode||t-lastAt>2500){setStatus('Mã đã quét trước đó: '+code,'warn')}
      lastCode=code;lastAt=t;return;
    }
    seen[code]=1;lastCode=code;lastAt=t;
    cur.codes.push({code:code,time:now()});
    if(!cur.file){cur.note=$('note').value.trim();cur.file=mkName();sessions.unshift(cur)}
    cur.updated=Date.now();cur.synced=false;persist();scheduleSave(cur);   // lưu máy ngay, đẩy GitHub sau ~1 giây
    feedback();render();
    setStatus('✓ Đã ghi mã #'+cur.codes.length+': '+code,'ok');
  }
  function tick(){
    if(!running)return;
    if(vid.readyState>=2&&vid.videoWidth){
      var s=Math.min(1,640/vid.videoWidth);
      var w=Math.round(vid.videoWidth*s),h=Math.round(vid.videoHeight*s);
      if(cv.width!==w){cv.width=w;cv.height=h}
      ctx.drawImage(vid,0,0,w,h);
      var img=ctx.getImageData(0,0,w,h);
      var res=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
      if(res&&res.data)onCode(res.data);
    }
    timer=setTimeout(tick,120);
  }
  async function getCam(){
    try{return await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
    catch(e){
      if(e.name==='NotAllowedError'||e.name==='SecurityError')throw e;
      return await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    }
  }
  function explain(e){
    var ua=navigator.userAgent||'',inApp=/Zalo|FBAN|FBAV|Messenger|Instagram|Line\/|TikTok|MicroMessenger/i.test(ua),framed=window.self!==window.top;
    if(!window.isSecureContext)return 'Trang chưa chạy HTTPS nên trình duyệt chặn camera. Hãy mở bằng địa chỉ https://.';
    if(inApp)return 'Bạn đang mở trong trình duyệt của ứng dụng (Zalo/Facebook...) nên camera bị chặn. Hãy bấm ⋯ → “Mở bằng Chrome/Safari”.';
    if(framed&&(e.name==='NotAllowedError'||e.name==='SecurityError'))return 'Trang đang nằm trong khung nhúng (iframe) không được cấp camera. Hãy mở trang trực tiếp ở tab riêng.';
    if(e.name==='NotAllowedError')return 'Camera đang bị chặn cho trang này. Vào Cài đặt trình duyệt → Quyền trang web → Camera → chọn Cho phép, rồi tải lại trang.';
    if(e.name==='NotReadableError')return 'Camera đang được ứng dụng khác sử dụng. Hãy tắt ứng dụng đó rồi thử lại.';
    if(e.name==='NotFoundError')return 'Không tìm thấy camera trên thiết bị.';
    return (e.name||'Lỗi')+': '+(e.message||'');
  }
  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      setStatus('Không dùng được camera: '+(window.isSecureContext?'trình duyệt quá cũ, hãy dùng Chrome/Safari mới.':'trang chưa chạy HTTPS.'),'warn');return}
    if(typeof jsQR==='undefined'){setStatus('Chưa tải được thư viện quét QR. Kiểm tra mạng rồi tải lại trang.','warn');return}
    if(!cur)newSession(false);
    try{
      stream=await getCam();
      vid.srcObject=stream;await vid.play();
      running=true;ui('scan');setStatus('Đang quét… đưa mã QR vào khung.');
      window.scrollTo({top:0,behavior:'smooth'});
      tick();
    }catch(e){
      running=false;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
      ui(codes().length?'stopped':'idle');
      setStatus('Không mở được camera. '+explain(e),'warn');
    }
  }
  function mkName(){
    var c=(cur.codes[0].code||'').replace(/[\s\/\\:*?"<>|]/g,'');
    var a=c.slice(0,NAME_A),b=c.slice(NAME_A,NAME_A+NAME_B);
    var base=(a+(b?'-'+b:'')).replace(/[^A-Za-z0-9._-]/g,'_')||('QR_'+Date.now()),name=base,k=2;
    while(sessions.some(function(s){return s.file===name}))name=base+'_'+(k++);
    return name;
  }
  function stop(){
    running=false;clearTimeout(timer);
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    vid.srcObject=null;
    if(!codes().length){ui('idle');setStatus('Đã dừng. Chưa có mã nào nên không lưu file.');return}
    clearTimeout(saveT);saveS=null;
    cur.note=$('note').value.trim();
    if(!cur.file){cur.file=mkName();sessions.unshift(cur)}
    commit(cur);
    ui('stopped');
    setStatus('Đã dừng và lưu file '+cur.file+' ('+cur.codes.length+' mã).','ok');
  }

  /* ---------- Lưu trữ + GitHub ---------- */
  function commit(s){
    s.updated=Date.now();s.synced=false;s.err='';persist();
    renderSessions();renderDetail();
    queuePush(s);
  }
  function ghOk(){return srv.ready}
  function dirPath(){return (cfg.dir||'').replace(/^\/+|\/+$/g,'')}
  function enc(p){return p.split('/').map(encodeURIComponent).join('/')}
  function api(path,opt){
    opt=opt||{};
    var h=Object.assign({'Accept':'application/vnd.github+json'},opt.headers||{});
    if(opt.body)h['Content-Type']='application/json';
    opt.headers=h;opt.cache='no-store';
    return fetch('/api/gh?p='+encodeURIComponent(path),opt);
  }
  async function initServer(){
    try{
      var r=await fetch('/api/gh?ping=1',{cache:'no-store'});
      if(!r.ok)throw new Error('ping');
      var j=await r.json();
      if(!j.configured||!j.authed)throw new Error('cfg');
      srv.ready=true;cfg.repo=j.repo;cfg.branch=j.branch;cfg.dir=j.dir;
    }catch(e){srv.ready=false}
  }
  function filePath(s){return (dirPath()?dirPath()+'/':'')+s.file+'.json'}
  function ref(){return 'ref='+encodeURIComponent(cfg.branch||'main')}
  function b64(str){return btoa(unescape(encodeURIComponent(str)))}
  function payload(s){
    return JSON.stringify({file:s.file,note:s.note||'',created:new Date(s.created).toISOString(),updated:new Date(s.updated||Date.now()).toISOString(),count:s.codes.length,codes:s.codes},null,1);
  }
  async function push(s){
    if(!ghOk())return;
    for(var a=0;a<2;a++){
      var body={message:'scan '+s.file,content:b64(payload(s)),branch:cfg.branch||'main'};
      if(s.sha)body.sha=s.sha;
      var r=await api('/contents/'+enc(filePath(s)),{method:'PUT',body:JSON.stringify(body)});
      if(r.ok){var j=await r.json();s.sha=j.content.sha;s.synced=true;s.syncedAt=Date.now();s.err='';persist();return}
      if(a===0&&(r.status===409||r.status===422)){
        var g=await api('/contents/'+enc(filePath(s))+'?'+ref());
        if(g.ok){s.sha=(await g.json()).sha;continue}
        s.sha='';
      }
      throw new Error(r.status+' '+(await r.text()).slice(0,100));
    }
  }
  var q=Promise.resolve();
  function queuePush(s){
    q=q.then(function(){return push(s)}).catch(function(e){s.err=e.message;persist()}).then(function(){renderSessions();renderDetail()});
    return q;
  }
  async function pull(){
    var base='/contents'+(dirPath()?'/'+enc(dirPath()):'');
    var t0=Date.now();
    var r=await api(base+'?'+ref());
    if(r.status===404)return 0;
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,100));
    var list=await r.json(),added=0;
    if(!Array.isArray(list))return 0;
    for(var i=0;i<list.length;i++){
      var f=list[i];
      if(f.type!=='file'||!/\.json$/.test(f.name))continue;
      var name=f.name.replace(/\.json$/,''),loc=null;
      for(var k=0;k<sessions.length;k++)if(sessions[k].file===name)loc=sessions[k];
      if(loc&&(loc===cur||!loc.synced||loc.sha===f.sha))continue;
      var g=await api('/contents/'+enc(f.path)+'?'+ref(),{headers:{'Accept':'application/vnd.github.raw+json'}});
      if(!g.ok)continue;
      var d;try{d=JSON.parse(await g.text())}catch(e){continue}
      var o={file:name,note:d.note||'',created:Date.parse(d.created)||Date.now(),updated:Date.parse(d.updated)||0,codes:d.codes||[],sha:f.sha,synced:true,err:''};
      if(loc){Object.assign(loc,o)}else{sessions.push(o);added++}
    }
    // file đã bị xoá trên GitHub (từ máy khác) thì xoá luôn ở máy này
    var names={};list.forEach(function(f){names[f.name.replace(/\.json$/,'')]=1});
    sessions=sessions.filter(function(s){return s===cur||!s.synced||!s.sha||names[s.file]||(s.syncedAt||0)>=t0});
    if(detail&&sessions.indexOf(detail)<0)closeDetail();
    sessions.sort(function(a,b){return b.created-a.created});
    persist();
    return added;
  }
  var busy=false;
  async function refresh(){   // đẩy file chưa lưu + tải danh sách mới từ GitHub (chạy lúc mở app / mở tab Đã lưu / có mạng lại)
    if(!ghOk()||busy||running)return;
    busy=true;
    try{
      for(var i=0;i<sessions.length;i++)if(!sessions[i].synced&&sessions[i]!==saveS)await queuePush(sessions[i]);
      await pull();
    }catch(e){}
    busy=false;
    renderSessions();renderDetail();
  }
  async function delRemote(s){
    if(!ghOk()||!(s.synced||s.sha))return true;
    try{
      var sha=s.sha;
      if(!sha){var g=await api('/contents/'+enc(filePath(s))+'?'+ref());if(g.status===404)return true;if(!g.ok)return false;sha=(await g.json()).sha}
      var r=await api('/contents/'+enc(filePath(s)),{method:'DELETE',body:JSON.stringify({message:'xoa '+s.file,sha:sha,branch:cfg.branch||'main'})});
      return r.ok||r.status===404;
    }catch(e){return false}
  }

  /* ---------- Tab 2: danh sách ---------- */
  function mkSpan(cls,txt){var e=document.createElement('span');e.className=cls;e.textContent=txt;return e}
  function renderSessions(){
    $('tcnt').textContent=sessions.length;
    var box=$('srows');box.innerHTML='';
    if(!sessions.length){box.innerHTML='<div class="empty">Chưa có danh sách nào. Quét mã đầu tiên là tự lưu.</div>';return}
    sessions.forEach(function(s,i){
      var r=document.createElement('div');r.className='srow it';
      r.append(mkSpan('n',i+1),mkSpan('f',s.file),mkSpan('d','📅 '+fmt(s.created)),mkSpan('c',s.codes.length+' mã'));
      if(s.note)r.append(mkSpan('nt',s.note));
      r.onclick=function(){openDetail(s)};
      box.appendChild(r);
    });
  }
  function delOne(s,i){
    var r=s.codes[i];if(!r||!confirm('Xóa ID này?\n'+r.code))return;
    s.codes.splice(i,1);
    if(s===cur){delete seen[r.code];render();if(!running)ui(cur.codes.length?'stopped':'idle')}
    commit(s);
    toast('Đã xóa ID');
  }
  function openDetail(s){detail=s;show('listView',false);show('detView',true);renderDetail();window.scrollTo(0,0)}
  function closeDetail(){detail=null;show('detView',false);show('listView',true);renderSessions()}
  function renderDetail(){
    if(!detail||tab!==2)return;
    var s=detail;
    $('dName').textContent=s.file;
    if(document.activeElement!==$('dNote'))$('dNote').value=s.note||'';
    $('dCnt').textContent=s.codes.length;
    var box=$('dIds');box.innerHTML='';
    if(!s.codes.length){box.innerHTML='<div class="empty">Không có mã.</div>';return}
    s.codes.forEach(function(r,i){
      var d=document.createElement('div');d.className='item click';
      var x=document.createElement('button');x.className='x';x.textContent='×';x.title='Xóa ID này';
      x.onclick=function(ev){ev.stopPropagation();delOne(s,i)};
      d.append(mkSpan('n',i+1),mkSpan('v',r.code),mkSpan('t',r.time.slice(11)),x);
      d.onclick=function(){copyStr(r.code,'Đã sao chép: '+r.code);d.classList.add('copied');setTimeout(function(){d.classList.remove('copied')},900)};
      box.appendChild(d);
    });
  }

  /* ---------- Xuất / chia sẻ / sao chép ---------- */
  function loadXlsx(){
    if(typeof XLSX!=='undefined')return Promise.resolve(true);
    return new Promise(function(ok){
      var sc=document.createElement('script');
      sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      sc.onload=function(){ok(typeof XLSX!=='undefined')};sc.onerror=function(){ok(false)};
      document.head.appendChild(sc);
    });
  }
  function saveBlob(blob,name){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  }
  function buildFile(s){   // chạy đồng bộ để mở bảng chia sẻ ngay trong lần bấm
    var base=s.file||('qr_'+Date.now());
    if(typeof XLSX!=='undefined'){
      var aoa=[['Ghi chú',s.note||''],[],['STT','Nội dung mã','Thời gian']].concat(s.codes.map(function(r,i){return [i+1,String(r.code),r.time||'']}));
      var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:8},{wch:50},{wch:20}];
      var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'QR');
      var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
      return {name:base+'.xlsx',blob:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})};
    }
    // không tải được thư viện Excel (mất mạng...) → xuất CSV, Excel vẫn mở được
    var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};
    var csv='\ufeff'+['STT,Nội dung mã,Thời gian'].concat(s.codes.map(function(r,i){return [i+1,q(r.code),q(r.time||'')].join(',')})).join('\r\n');
    toast('Chưa tải được thư viện Excel, xuất file CSV');
    return {name:base+'.csv',blob:new Blob([csv],{type:'text/csv;charset=utf-8'})};
  }
  function whyNoShare(e){
    var ua=navigator.userAgent||'';
    if(/Zalo|FBAN|FBAV|Messenger|Instagram|Line\/|TikTok|MicroMessenger/i.test(ua))return 'đang mở trong app Zalo/Facebook..., hãy mở bằng Chrome/Safari';
    if(!window.isSecureContext)return 'trang chưa chạy HTTPS';
    if(!navigator.share)return 'trình duyệt này không hỗ trợ chia sẻ';
    return e?(e.name||'lỗi')+(e.message?': '+String(e.message).slice(0,80):''):'không rõ nguyên nhân';
  }
  var shareBusy=false;
  async function exportXlsx(s){
    if(!s||!s.codes.length||shareBusy)return;
    // Tạo file ĐỒNG BỘ nếu thư viện đã có → giữ nguyên "quyền người dùng" của lần bấm
    var file;
    try{
      if(typeof XLSX==='undefined')await loadXlsx();
      file=buildFile(s);
    }catch(e){toast('Lỗi tạo file: '+(e&&e.message||e));return}
    var f=null,err=null,tried=false;
    try{f=new File([file.blob],file.name,{type:file.blob.type})}catch(e){err=e}
    if(f&&navigator.share){
      var data={files:[f]};   // không kèm title/text: một số máy Android từ chối khi gộp
      var okShare=true;
      try{if(navigator.canShare)okShare=navigator.canShare(data)}catch(e){okShare=false}
      if(okShare){
        tried=true;shareBusy=true;
        try{await navigator.share(data);shareBusy=false;return}
        catch(e){
          shareBusy=false;
          if(e&&e.name==='AbortError')return;   // người dùng tự đóng bảng chia sẻ
          err=e;
        }
      }
    }
    // Không chia sẻ file được → hiện bảng lựa chọn (mỗi nút bấm là một lần "người dùng bấm" mới nên được phép chia sẻ)
    if(tried&&navigator.share){showShareFallback(s,file);return}
    saveBlob(file.blob,file.name);
    toast('Đã tải file '+file.name+' ('+whyNoShare(err)+')',5000);
  }
  function csvFile(s){
    var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};
    var csv='\ufeff'+['STT,Nội dung mã,Thời gian'].concat(s.codes.map(function(r,i){return [i+1,q(r.code),q(r.time||'')].join(',')})).join('\r\n');
    return new File([csv],(s.file||'qr')+'.csv',{type:'text/csv'});
  }
  function showShareFallback(s,file){
    var old=document.getElementById('shFb');if(old)old.remove();
    var ov=document.createElement('div');ov.id='shFb';
    ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px';
    var box=document.createElement('div');
    box.style.cssText='background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:16px;width:100%;max-width:520px';
    box.innerHTML='<div style="font-weight:700;margin-bottom:4px">Máy chặn chia sẻ file Excel</div><div style="color:var(--mu);font-size:14px;margin-bottom:8px">Chọn cách khác:</div>';
    function add(label,cls,fn){
      var b=document.createElement('button');b.textContent=label;b.className=cls;b.style.cssText='width:100%;margin-top:8px';
      b.onclick=function(){fn(b)};box.appendChild(b);
    }
    add('📝 Chia sẻ dạng văn bản (mỗi mã 1 dòng)','',function(){ov.remove();shareText()});
    add('📄 Chia sẻ file CSV (mở được bằng Excel)','sec',async function(){
      var f=csvFile(s);
      try{
        if(navigator.canShare&&!navigator.canShare({files:[f]}))throw new Error('no');
        await navigator.share({files:[f]});ov.remove();
      }catch(e){
        if(e&&e.name==='AbortError')return;
        saveBlob(f,f.name);ov.remove();toast('Không chia sẻ được CSV, đã tải file '+f.name,4000);
      }
    });
    add('💾 Tải file Excel về máy','sec',function(){saveBlob(file.blob,file.name);ov.remove();toast('Đã tải file '+file.name+' (mục Tải xuống)',4000)});
    add('Đóng','sec',function(){ov.remove()});
    ov.onclick=function(e){if(e.target===ov)ov.remove()};
    ov.appendChild(box);document.body.appendChild(ov);
  }
  async function copyStr(str,okMsg){
    try{await navigator.clipboard.writeText(str);toast(okMsg)}
    catch(e){
      var ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast(okMsg)}catch(_){toast('Không sao chép được')}
      ta.remove();
    }
  }
  function asText(s){return s.codes.map(function(r){return r.code}).join('\n')}
  async function shareText(){
    if(!codes().length)return;
    if(navigator.share){
      try{await navigator.share({title:'Danh sách mã QR',text:asText(cur)});return}
      catch(e){if(e.name==='AbortError')return}
    }
    copyStr(asText(cur),'Đã sao chép '+cur.codes.length+' dòng');
  }
  async function shareLink(){
    var url=location.origin+location.pathname;
    if(navigator.share){
      try{await navigator.share({title:'Quét Lot ID',text:'Mở link này để dùng / cài app Quét Lot ID:',url:url});return}
      catch(e){if(e.name==='AbortError')return}
    }
    copyStr(url,'Đã sao chép link');
  }

  /* ---------- Sự kiện ---------- */
  $('t1').onclick=function(){showTab(1)};
  function openList(){if(detail)closeDetail();showTab(2)}
  $('t2').onclick=openList;
  $('bStart').onclick=start;
  $('bResume').onclick=start;
  $('bNew').onclick=function(){newSession(true);render();start()};
  $('bStop').onclick=stop;
  $('bXlsx').onclick=function(){exportXlsx(cur)};
  $('bShare').onclick=shareText;
  $('bCopy').onclick=function(){if(codes().length)copyStr(asText(cur),'Đã sao chép '+cur.codes.length+' dòng')};
  $('bLink').onclick=shareLink;
    $('dCopy').onclick=function(){if(detail&&detail.codes.length)copyStr(asText(detail),'Đã sao chép '+detail.codes.length+' ID')};
  $('dXlsx').onclick=function(){exportXlsx(detail)};
  $('dScan').onclick=function(){
    if(!detail)return;
    var s=detail;
    flushSave();
    cur=s;seen={};s.codes.forEach(function(r){seen[r.code]=1});
    $('note').value=s.note||'';
    closeDetail();showTab(1);render();ui('stopped');
    start();
  };
  $('dDel').onclick=async function(){
    if(!detail||!confirm('Xoá file '+detail.file+' ('+detail.codes.length+' mã)?'))return;
    var s=detail,okRemote=await delRemote(s);
    sessions.splice(sessions.indexOf(s),1);persist();
    if(s===cur){cur=null;seen={};$('note').value='';render();ui('idle');setStatus('Bấm “Quét” để mở camera.')}
    closeDetail();
    toast(okRemote?'Đã xoá':'Đã xoá trên máy, chưa xoá được trên GitHub');
  };
  $('note').addEventListener('input',function(){
    if(!cur)return;
    cur.note=this.value.trim();
    if(cur.file){cur.updated=Date.now();cur.synced=false;persist();scheduleSave(cur)}
  });
  $('dNote').addEventListener('input',function(){
    if(!detail)return;
    detail.note=this.value.trim();detail.updated=Date.now();detail.synced=false;persist();scheduleSave(detail);
    if(detail===cur)$('note').value=detail.note;
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&running)stop()});
  window.addEventListener('online',refresh);
  document.addEventListener('visibilitychange',function(){if(document.hidden)flushSave();else refresh()});
  window.addEventListener('pagehide',flushSave);
  var dip=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dip=e;show('ctlInstall',true)});
  $('bInstall').onclick=async function(){if(!dip)return;dip.prompt();try{await dip.userChoice}catch(_){}dip=null;show('ctlInstall',false)};
  window.addEventListener('appinstalled',function(){show('ctlInstall',false)});
  window.addEventListener('resize',fitBar);
  /* vuốt trái/phải để đổi tab */
  var sx=0,sy=0,st=0,sOk=false;
  document.addEventListener('touchstart',function(e){
    var t=e.target;
    sOk=e.touches.length===1&&!(t.closest&&t.closest('input,textarea,dialog'));
    if(sOk){sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()}
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!sOk)return;sOk=false;
    var c=e.changedTouches[0],dx=c.clientX-sx,dy=c.clientY-sy;
    if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
    if(dx<0&&tab===1)openList();else if(dx>0&&tab===2)showTab(1);
  },{passive:true});

  ui('idle');render();renderSessions();
  initServer().then(refresh);
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
