<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét mã QR liên tục</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--pr:#2563eb;--ok:#16a34a;--dg:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2c333d;--pr:#3b82f6;--ok:#22c55e;--dg:#ef4444}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2c333d;--pr:#3b82f6;--ok:#22c55e;--dg:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:1/1;display:none}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
.frame.hit{border-color:var(--ok)}
.status{margin:12px 0;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--mu);font-size:14px;min-height:44px}
.status.ok{color:var(--ok);border-color:var(--ok)}
.status.warn{color:var(--dg);border-color:var(--dg)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button{flex:1;min-width:130px;padding:14px 16px;border:0;border-radius:12px;font:600 16px inherit;font-family:inherit;background:var(--pr);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.dg{background:var(--dg)}
button.ok{background:var(--ok)}
button:disabled{opacity:.45}
[hidden]{display:none!important}
.list{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.lh{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);font-weight:600}
.item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);align-items:flex-start}
.item:last-child{border-bottom:0}
.n{color:var(--mu);min-width:28px;font-variant-numeric:tabular-nums}
.v{flex:1;word-break:break-all}
.t{color:var(--mu);font-size:12px;white-space:nowrap}
.x{background:none;border:0;color:var(--mu);min-width:0;flex:0;padding:0 4px;font-size:20px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px 0 8px}
.empty{padding:22px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Quét mã QR liên tục</h1>

  <div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="frame" id="frame"></div></div>
  <div class="status" id="status">Bấm “Quét” để mở camera.</div>

  <div class="row" id="ctl">
    <button id="bStart">▶ Quét</button>
  </div>
  <div class="row" id="ctlScan" hidden>
    <button class="dg" id="bStop">⏹ Dừng</button>
  </div>
  <div class="row" id="ctlStopped" hidden>
    <button id="bResume">▶ Tiếp tục quét</button>
    <button class="ok" id="bXlsx">📊 Xuất Excel</button>
    <button class="sec" id="bShare">📤 Chia sẻ văn bản</button>
    <button class="sec" id="bCopy">📋 Sao chép</button>
    <button class="sec" id="bClear">🗑 Xoá tất cả</button>
  </div>

  <div class="list">
    <div class="lh"><span>Danh sách mã</span><span id="cnt">0</span></div>
    <div id="items"><div class="empty">Chưa có mã nào.</div></div>
  </div>
  <footer>© Đức Trung</footer>
</div>
<canvas id="cv" hidden></canvas>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var vid=$('vid'),cam=$('cam'),frame=$('frame'),cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
  var stream=null,running=false,timer=null,lastCode='',lastAt=0,audioCtx=null;
  var rows=[]; // {code,time}
  var seen={};

  function setStatus(t,c){var s=$('status');s.textContent=t;s.className='status'+(c?' '+c:'')}
  function show(id,on){$(id).hidden=!on}
  function ui(mode){
    show('ctl',mode==='idle');show('ctlScan',mode==='scan');show('ctlStopped',mode==='stopped');
    cam.classList.toggle('on',mode==='scan');
    var has=rows.length>0;
    ['bXlsx','bShare','bCopy','bClear'].forEach(function(i){$(i).disabled=!has});
  }
  function pad(n){return n<10?'0'+n:n}
  function now(){var d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}

  function feedback(){
    try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
    try{
      audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=880;g.gain.value=.15;
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12);
    }catch(e){}
    frame.classList.add('hit');setTimeout(function(){frame.classList.remove('hit')},250);
  }

  function render(){
    $('cnt').textContent=rows.length;
    var box=$('items');box.innerHTML='';
    if(!rows.length){box.innerHTML='<div class="empty">Chưa có mã nào.</div>';return}
    for(var i=rows.length-1;i>=0;i--){(function(i){
      var r=rows[i],d=document.createElement('div');d.className='item';
      var n=document.createElement('span');n.className='n';n.textContent=i+1;
      var v=document.createElement('span');v.className='v';v.textContent=r.code;
      var t=document.createElement('span');t.className='t';t.textContent=r.time.slice(11);
      var x=document.createElement('button');x.className='x';x.textContent='×';x.title='Xoá';
      x.onclick=function(){delete seen[r.code];rows.splice(i,1);render();if(!running)ui('stopped')};
      d.append(n,v,t,x);box.appendChild(d);
    })(i)}
  }

  function onCode(code){
    var t=Date.now();
    if(seen[code]){
      if(code!==lastCode||t-lastAt>2500){setStatus('Mã đã quét trước đó: '+code,'warn')}
      lastCode=code;lastAt=t;return;
    }
    seen[code]=1;lastCode=code;lastAt=t;
    rows.push({code:code,time:now()});
    feedback();render();
    setStatus('✓ Đã ghi mã #'+rows.length+': '+code,'ok');
  }

  function tick(){
    if(!running)return;
    if(vid.readyState>=2&&vid.videoWidth){
      var s=Math.min(1,640/vid.videoWidth);
      var w=Math.round(vid.videoWidth*s),h=Math.round(vid.videoHeight*s);
      if(cv.width!==w){cv.width=w;cv.height=h}
      ctx.drawImage(vid,0,0,w,h);
      var img=ctx.getImageData(0,0,w,h);
      var res=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
      if(res&&res.data)onCode(res.data);
    }
    timer=setTimeout(tick,120);
  }

  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      setStatus('Trình duyệt không hỗ trợ camera. Hãy dùng Chrome/Safari mới nhất.','warn');return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
      vid.srcObject=stream;await vid.play();
      running=true;ui('scan');setStatus('Đang quét… đưa mã QR vào khung.');
      tick();
    }catch(e){
      ui(rows.length?'stopped':'idle');
      setStatus('Không mở được camera: '+(e.name==='NotAllowedError'?'bạn chưa cấp quyền camera.':e.message),'warn');
    }
  }
  function stop(){
    running=false;clearTimeout(timer);
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    vid.srcObject=null;
    ui('stopped');
    setStatus('Đã dừng. Có '+rows.length+' mã. Bạn có thể xuất Excel, chia sẻ hoặc tiếp tục quét.');
  }

  function asText(){return rows.map(function(r){return r.code}).join('\n')}

  async function exportXlsx(){
    if(!rows.length)return;
    var aoa=[['STT','Nội dung mã','Thời gian']].concat(rows.map(function(r,i){return [i+1,r.code,r.time]}));
    var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:6},{wch:50},{wch:20}];
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'QR');
    var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    var d=new Date(),name='qr_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.xlsx';
    try{
      var dl=window.claude&&await window.claude.use('downloads');
      if(dl){await dl.save({filename:name,data:buf});setStatus('Đã xuất file '+name,'ok');return}
    }catch(e){if(e&&e.code==='declined'){setStatus('Bạn đã huỷ lưu file.');return}}
    // dự phòng: tải trực tiếp / chia sẻ file
    try{
      var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var f=new File([blob],name,{type:blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      setStatus('Đã xuất file '+name,'ok');
    }catch(e){setStatus('Không xuất được file: '+e.message,'warn')}
  }

  async function copyText(){
    try{await navigator.clipboard.writeText(asText());setStatus('Đã sao chép '+rows.length+' dòng.','ok')}
    catch(e){
      var ta=document.createElement('textarea');ta.value=asText();document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');setStatus('Đã sao chép '+rows.length+' dòng.','ok')}catch(_){setStatus('Không sao chép được.','warn')}
      ta.remove();
    }
  }
  async function shareText(){
    if(navigator.share){
      try{await navigator.share({title:'Danh sách mã QR',text:asText()});return}
      catch(e){if(e.name==='AbortError')return}
    }
    copyText();
  }

  $('bStart').onclick=start;
  $('bResume').onclick=start;
  $('bStop').onclick=stop;
  $('bXlsx').onclick=exportXlsx;
  $('bShare').onclick=shareText;
  $('bCopy').onclick=copyText;
  $('bClear').onclick=function(){
    if(!rows.length||!confirm('Xoá toàn bộ '+rows.length+' mã đã quét?'))return;
    rows=[];seen={};render();ui('stopped');setStatus('Đã xoá danh sách.');
  };
  document.addEventListener('visibilitychange',function(){if(document.hidden&&running)stop()});
  ui('idle');
})();
</script>
</body>
</html>
